# Mirrors backend-tests.yml's scope: runs the frontend's real checks (lint,
# unit tests, typecheck + build) on every push/PR that touches frontend/.
# No deploy step -- this project ships as a Tauri + PyInstaller desktop app
# (docs/build-plan.md Phase 6, not yet started), unrelated to this workflow.
name: frontend-tests

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Typecheck + build
        run: npm run build
